<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Map | CleanCity AI</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px Arial,sans-serif;background:#f3f7f4;color:#203329}header{background:#176b45;color:#fff;padding:18px 5%}header a{color:white;margin-right:14px;text-decoration:none}main{max-width:1200px;margin:24px auto;padding:0 18px}.card{background:white;padding:18px;border-radius:12px;margin:16px 0;box-shadow:0 3px 14px #0001}#map{height:65vh;min-height:420px;border-radius:10px}.muted{color:#65756b}.legend span{display:inline-block;margin-right:14px}.btn{background:#176b45;color:#fff;padding:10px 14px;border:0;border-radius:7px;cursor:pointer;text-decoration:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e5ebe7} .table-wrap{overflow:auto}</style></head><body><header><h1>CleanCity AI · Collection Route Map</h1><nav><a href="/dashboard">Dashboard</a><a href="/bins">Smart Bins</a><a href="/hotspots">Hotspots</a><a href="/routes">Routes</a><a href="/complaints">Complaints</a><a href="/detection-history">Detection History</a></nav></header><main><section class="card"><h2>Optimized Stop Order</h2><p class="muted">The line joins stops in optimizer order using straight-line segments, not road navigation.</p><form method="post" action="/optimize-route"><button class="btn">Optimize Route Now</button></form><p id="status">Loading route…</p><div id="map"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([18.5204,73.8567],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);fetch('/api/route').then(r=>r.json()).then(d=>{const pts=d.stops||[];if(!pts.length){document.getElementById('status').textContent=d.warning||'No route available. Click Optimize Route Now.';return;}const line=[];pts.forEach(p=>{const xy=[p.latitude,p.longitude];line.push(xy);L.marker(xy).addTo(map).bindPopup('<b>Stop '+p.route_order+': '+p.name+'</b><br>Zone: '+p.zone+'<br>Risk/fill: '+(p.risk_score||'—'));});if(line.length>1)L.polyline(line,{color:'#176b45',weight:4}).addTo(map);map.fitBounds(line,{padding:[25,25]});document.getElementById('status').textContent=pts.length+' route stops displayed.';}).catch(()=>document.getElementById('status').textContent='Could not load route.');</script></body></html>
