
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | CleanCity AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8f5;
            color: #26352c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-card {
            background: white;
            width: 100%;
            max-width: 540px;
            padding: 45px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 8px 35px #174d3012;
        }

        .logo {
            color: #176b45;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .error-code {
            color: #176b45;
            font-size: 85px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 14px;
        }

        p {
            color: #68776d;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 13px 20px;
            background: #176b45;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #105536;
        }

        .secondary {
            display: block;
            margin-top: 20px;
            color: #176b45;
            text-decoration: none;
            font-size: 14px;
        }

        footer {
            color: #859087;
            margin-top: 35px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="error-card">
        <div class="logo">🌿 CleanCity AI</div>

        <div class="error-code">404</div>

        <h1>Oops! Page Not Found</h1>

        <p>
            The page you are looking for does not exist or may have been moved.
            Return to the CleanCity AI dashboard to continue.
        </p>

        <a class="button" href="/dashboard">Go to Dashboard</a>

        <a class="secondary" href="/">← Back to Home</a>

        <footer>
            CleanCity AI — Smart Waste Management System
        </footer>
    </main>
</body>
</html>
